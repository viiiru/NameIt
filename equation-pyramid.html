<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <title>Equation Pyramid - Math Puzzle Game</title>
    <meta name="description" content="Equation Pyramid - Solve math puzzles by combining numbers to reach the target!" />
    <link rel="stylesheet" href="equation-pyramid.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="title">Equation Pyramid</h1>
        <p class="subtitle">Combine numbers to reach the target!</p>
      </header>

      <main class="game">
        <section class="hud">
          <div class="hud-item">
            <span class="hud-label">Time</span>
            <span id="time-remaining" class="hud-value">60</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">Score</span>
            <span id="score" class="hud-value">0</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">Target</span>
            <span id="target-value" class="hud-value">0</span>
          </div>
          <div class="hud-item">
            <span class="hud-label">Level</span>
            <select id="difficulty-select" class="hud-select">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
        </section>

        <section class="pyramid-container">
          <div id="pyramid-display" class="pyramid-display"></div>
        </section>

        <section class="selected-display">
          <div class="selected-label">Selected:</div>
          <div id="selected-operations" class="selected-operations">–</div>
          <div class="selected-result">Result: <span id="calculated-result">–</span></div>
        </section>

        <section class="last-word-display">
          <div id="last-result" class="last-word">–</div>
        </section>

        <section class="controls">
          <button id="start-button" class="btn primary">Start Round</button>
          <button id="stop-button" class="btn secondary" style="display: none;">Stop Game</button>
          <button id="clear-button" class="btn secondary" style="display: none;">Clear</button>
          <button id="submit-button" class="btn primary" style="display: none;">Submit</button>
          <button id="sound-toggle-button" class="btn secondary">Sound: On</button>
        </section>

        <section class="status">
          <div id="game-message" class="status-line"></div>
          <div id="hint-message" class="status-line hint">Click on numbers and operations to build your equation!</div>
        </section>
      </main>

      <footer class="footer">
        <span>Built for math puzzle solving practice.</span>
        <a href="index.html" class="back-button" title="Back to Fun Games">← Back to Fun Games</a>
        <div id="leaderboard-display" class="leaderboard-end-game" style="display: none;"></div>
      </footer>
    </div>

    <script src="leaderboard.js"></script>
    <script src="equation-pyramid.js"></script>
  </body>
</html>
