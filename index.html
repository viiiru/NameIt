<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fun Games - Play Fun Educational Games</title>
    <meta name="description" content="Fun Games - A collection of fun and educational games. Play Name It and more!" />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="site-title">Fun Games</h1>
        <p class="site-subtitle">Play fun and educational games</p>
      </header>

      <main class="games-container">
        <div class="games-grid">
          <div class="game-card" data-game="nameit">
            <div class="game-icon">🎮</div>
            <h2 class="game-title">Name It</h2>
            <p class="game-description">Say what you see. Beat the clock!</p>
            <p class="game-details">Voice-controlled vocabulary game</p>
            <button class="play-button">Play Now</button>
          </div>
          
          <!-- More games can be added here in the future -->
        </div>
      </main>

      <footer class="footer">
        <span>Built for fun and learning</span>
      </footer>
    </div>

    <script src="main.js"></script>
  </body>
</html>
