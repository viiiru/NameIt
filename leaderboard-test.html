<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Supabase Leaderboards</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    h2 { margin-top: 40px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
    th, td { border: 1px solid #aaa; padding: 6px 12px; text-align: left; }
    th { background-color: #eee; }
  </style>
</head>
<body>
  <h1>Supabase Leaderboards Test</h1>
  <p>Avaa selaimen console nähdäksesi mahdolliset virheet.</p>

  <div id="leaderboards"></div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    // Korvaa nämä Netlifyssä env-muuttujilla, jos haluat
    const supabaseUrl = "https://ikvbchnjrfkodlwspthg.supabase.co";
    const supabaseAnonKey = "sb_publishable_dQJ_ZV-i4UBij1TjiIT2qQ_2VPsjYbJ";
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    const games = [
      { key: "nameit", orderDesc: true },
      { key: "typeit", orderDesc: true },
      { key: "equation-pyramid", orderDesc: true },
      { key: "knights-tour", orderDesc: false }
    ];

    const modes = ["30s", "60s", "8x8"]; // testimoodit, laajenna tarpeen mukaan

    const container = document.getElementById("leaderboards");

    async function fetchAndRenderLeaderboard(gameKey, mode) {
      let query = supabase
        .from("scores")
        .select("player, score")
        .eq("game", gameKey)
        .eq("mode", mode)
        .limit(10);

      // Järjestä oikein pelityypin mukaan
      const game = games.find(g => g.key === gameKey);
      query = query.order("score", { ascending: !game.orderDesc });

      const { data, error } = await query;
      if (error) {
        console.error(`Error fetching ${gameKey} ${mode}:`, error);
        return;
      }

      // Luo taulukko
      const table = document.createElement("table");
      const title = document.createElement("h2");
      title.textContent = `Leaderboard: ${gameKey} (${mode})`;
      container.appendChild(title);

      const header = document.createElement("tr");
      header.innerHTML = "<th>#</th><th>Player</th><th>Score</th>";
      table.appendChild(header);

      data.forEach((row, idx) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${idx + 1}</td><td>${row.player}</td><td>${row.score}</td>`;
        table.appendChild(tr);
      });

      container.appendChild(table);
    }

    async function loadAllLeaderboards() {
      for (const game of games) {
        for (const mode of modes) {
          await fetchAndRenderLeaderboard(game.key, mode);
        }
      }
    }

    loadAllLeaderboards();
  </script>
</body>
</html>
